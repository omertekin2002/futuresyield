name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Updater tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install data dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run updater tests
        run: python -m unittest discover -s tests -v

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check app.js syntax
        run: node --check app.js

      - name: Check market snapshot parses
        run: python3 -m json.tool data/market.json > /dev/null

      - name: Validate market snapshots against the schema
        run: python3 -m scripts.snapshot_schema data/market.json tests/fixtures/market.json

      - name: Assemble static site
        run: bash scripts/build_site.sh

  smoke:
    name: Dashboard smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install smoke-test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run dashboard smoke test
        run: python -m unittest tests/e2e/test_dashboard_smoke.py -v
