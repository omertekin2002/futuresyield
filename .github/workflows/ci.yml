name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  # Once a weekday after the end-of-day archive: pages.yml's 23:20 TRT
  # (20:20 UTC) run appends the day's close to data-history, and this run
  # checks the real archive with the smoke and audit jobs. 21:50 UTC is
  # 00:50 TRT, Tuesday to Saturday. GitHub may start it late; any time before
  # the next session still catches a close the page can't open.
  schedule:
    - cron: "50 21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Updater tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install data dependencies
        run: python -m pip install --requirement requirements.txt --constraint constraints.txt

      - name: Run updater tests
        run: python -m unittest discover -s tests -v

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check app.js syntax
        run: node --check app.js

      - name: Check market snapshot parses
        run: python3 -m json.tool data/market.json > /dev/null

      - name: Validate market snapshots against the schema
        run: python3 -m scripts.snapshot_schema data/market.json tests/fixtures/market.json

      - name: Assemble static site
        run: bash scripts/build_site.sh

      # A pinned release, checked against its published SHA-256. It runs
      # shellcheck, preinstalled on the runner, over every run: script.
      - name: Lint workflows with actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  smoke:
    name: Dashboard smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Install smoke-test dependencies
        run: python -m pip install --requirement requirements-dev.txt --constraint constraints.txt

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      # Read-only checkout of the data-history branch by the script pages.yml
      # uses. Only a missing branch is skipped (ls-remote exits 2, and the
      # script prints no directory); any other error fails.
      - name: Fetch archived end-of-day snapshots
        id: archive
        run: |
          dir=$(bash scripts/fetch_history.sh "$RUNNER_TEMP/data-history")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Run dashboard smoke test
        env:
          VADE_ARCHIVE_DIR: ${{ steps.archive.outputs.dir }}
        run: python -m unittest tests/e2e/test_dashboard_smoke.py -v

  archive:
    name: Archive audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install holiday calendar
        run: python -m pip install "$(grep '^holidays==' requirements.txt)" --constraint constraints.txt

      # Read-only checkout of the data-history branch by the script pages.yml
      # uses. Only a missing branch is skipped (ls-remote exits 2, and the
      # script prints no directory); any other error fails.
      - name: Fetch archived end-of-day snapshots
        id: archive
        run: |
          dir=$(bash scripts/fetch_history.sh "$RUNNER_TEMP/data-history")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Audit the archive against the current schema and end-of-day rule
        if: steps.archive.outputs.dir != ''
        run: python -m scripts.audit_history "${{ steps.archive.outputs.dir }}"
