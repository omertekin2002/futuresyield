name: Refresh market data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is set per job, not per workflow: a workflow-level group would
# cancel the whole run, including an archive push already in progress. Refresh,
# build and deploy use separate groups so an older run's job cannot cancel a
# newer run's later job; a newer refresh, build or deploy still cancels an
# older one. The archive never cancels: its group waits instead.
#
# refresh runs the tests and the updater and uploads the snapshot. build (site
# and Pages artifact) and archive (data-history) each need only refresh, so a
# failed history fetch or Pages step never costs the day's close, and a failed
# test or updater run stops both. deploy needs build.
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: github-pages-refresh
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install data dependencies
        run: python -m pip install --requirement requirements.txt --constraint constraints.txt

      - name: Run updater tests
        run: python -m unittest discover -s tests -v

      - name: Refresh borsapy market snapshot
        run: python scripts/update_data.py

      - name: Upload snapshot for the site and the history archive
        uses: actions/upload-artifact@v7
        with:
          name: market-snapshot
          path: data/market.json
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    needs: refresh
    timeout-minutes: 10
    concurrency:
      group: github-pages-build
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download refreshed snapshot
        uses: actions/download-artifact@v8
        with:
          name: market-snapshot
          path: data

      # Without a data-history branch the site ships with no history, and
      # snapshots this run archives appear in the next deploy. Any other
      # failure to read origin fails the run, so a site with its history
      # missing is never deployed.
      - name: Fetch archived end-of-day snapshots
        run: bash scripts/fetch_history.sh "$RUNNER_TEMP/data-history"

      - name: Prepare static site
        env:
          HISTORY_DIR: ${{ runner.temp }}/data-history/history
        run: bash scripts/build_site.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Keeps one end-of-day snapshot per trading day on the data-history branch.
  # Independent of build and deploy, so a failed archive never blocks or undoes
  # the deploy, and a failed history fetch or Pages step never skips the archive.
  archive:
    runs-on: ubuntu-latest
    needs: refresh
    timeout-minutes: 10
    concurrency:
      group: data-history
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install holiday calendar
        run: python -m pip install "$(grep '^holidays==' requirements.txt)" --constraint constraints.txt

      - name: Download snapshot
        uses: actions/download-artifact@v8
        with:
          name: market-snapshot
          path: ${{ runner.temp }}/snapshot

      - name: Archive end-of-day snapshot to data-history
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >-
          bash scripts/archive_history.sh
          "$RUNNER_TEMP/snapshot/market.json"
          "$RUNNER_TEMP/data-history"
