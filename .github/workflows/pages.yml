name: Refresh market data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is set per job, not per workflow: a workflow-level group would
# cancel the whole run, including an archive push already in progress. Build
# and deploy use separate groups so an older run's deploy cannot cancel a newer
# run's build; a newer build or deploy still cancels an older one.
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-build
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install data dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run updater tests
        run: python -m unittest discover -s tests -v

      - name: Refresh borsapy market snapshot
        run: python scripts/update_data.py

      - name: Upload snapshot for the history archive
        uses: actions/upload-artifact@v7
        with:
          name: market-snapshot
          path: data/market.json
          if-no-files-found: error
          retention-days: 1

      # Optional: without a data-history branch the site ships with no
      # history. Snapshots this run archives appear in the next deploy.
      - name: Fetch archived end-of-day snapshots
        run: |
          if git ls-remote --exit-code --heads origin data-history > /dev/null; then
            git fetch --no-tags --depth=1 origin data-history
            git worktree add --detach "$RUNNER_TEMP/data-history" FETCH_HEAD
          else
            echo "No data-history branch; building without history"
          fi

      - name: Prepare static site
        env:
          HISTORY_DIR: ${{ runner.temp }}/data-history/history
        run: bash scripts/build_site.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Keeps one end-of-day snapshot per trading day on the data-history branch.
  # Independent of deploy, so a failed archive never blocks or undoes it.
  archive:
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: data-history
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install holiday calendar
        run: python -m pip install "$(grep '^holidays==' requirements.txt)"

      - name: Download snapshot
        uses: actions/download-artifact@v8
        with:
          name: market-snapshot
          path: ${{ runner.temp }}/snapshot

      - name: Archive end-of-day snapshot to data-history
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >-
          bash scripts/archive_history.sh
          "$RUNNER_TEMP/snapshot/market.json"
          "$RUNNER_TEMP/data-history"
